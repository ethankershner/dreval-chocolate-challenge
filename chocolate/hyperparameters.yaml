---
# Every model here has one fixed configuration, so DrEval skips hyperparameter tuning and trains each model on
# train + validation of every split.
# The MLP holds out DrEval's early-stopping cell lines (20 of the validation cell lines) for early stopping.

# Conventional defaults, not tuned: two hidden layers of 512 ReLU units, dropout 0.2, Adam at its default learning
# rate without weight decay, batch size 64, early stopping on DrEval's early-stopping cell lines with patience 10.
MultiTaskMLP:
  hidden: [512]
  depth: [2]
  dropout: [0.2]
  lr: [0.001]
  batch_size: [64]
  max_epochs: [200]
  patience: [10]
  n_ensemble: [10]
  seed: [0]

# The penalty grid is in per_drug_ridge.py (RIDGE_ALPHAS); the penalty is chosen per drug inside train().
PerDrugRidge:
  seed: [0]

# Trains PerDrugRidge and MultiTaskMLP with their own entries and averages them.
AverageEnsemble:
  seed: [0]

# The ablation in ensemble_mf_ablation.ipynb: DrEval's EnsembleMF with exactly the settings of its own
# hyperparameters.yaml entry (drevalpy/models/EnsembleMF), trained on per-drug standardized targets.
EnsembleMFStandardized:
  feature_transform: [rank]
  gene_list: [landmark_genes]
  n_bits: [256]
  hidden_dim: [256]
  emb_dim: [128]
  n_layers: [1]
  dropout: [0.2]
  use_mlp_head: [true]
  mlp_hidden: [256]
  use_drug_id_embedding: [true]
  n_ensemble: [20]
  learning_rate: [0.0003]
  weight_decay: [0.00001]
  batch_size: [2048]
  max_epochs: [300]
  patience: [25]
  seed: [0]
